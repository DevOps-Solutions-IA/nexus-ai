name: nexus-ai-local
services:
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_DB: nexus_local
      POSTGRES_USER: nexus_local
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:${NXS_POSTGRES_PORT:-15432}:5432"]
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
      - "./infrastructure/postgres/roles.sql:/docker-entrypoint-initdb.d/10-nxs-roles.sql:ro"
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U nexus_local -d nexus_local"], interval: 5s, timeout: 3s, retries: 20}
  valkey:
    image: valkey/valkey:8.1.3-alpine@sha256:d827e7f7552cdee40cc7482dbae9da020f42bc47669af6f71182a4ef76a22773
    command: ["valkey-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${NXS_VALKEY_PORT:-16379}:6379"]
    volumes: ["valkey-data:/data"]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  nats:
    image: nats:2.11.8-alpine@sha256:71092f77d707a4a81b12aca5096d6b2d2e07ad16aa57c84066940a17af74f61a
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports: ["127.0.0.1:${NXS_NATS_PORT:-14222}:4222", "127.0.0.1:${NXS_NATS_HTTP_PORT:-18222}:8222"]
    volumes: ["nats-data:/data"]
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"], interval: 5s, timeout: 3s, retries: 20}
volumes:
  postgres-data:
  valkey-data:
  nats-data:
