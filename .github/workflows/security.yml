name: NXS Security
on:
  pull_request:
  push:
    branches: [main, "feat/nxs-**", "fix/nxs-**", "release/**"]
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
  security-events: write
concurrency:
  group: nxs-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.14", cache: pip}
      - name: Install tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.32
          uv sync --frozen --all-groups
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - name: Secret scan
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --exit-code 1
      - name: SAST and dependency audit
        run: |
          uv run bandit -q -lll -c pyproject.toml -r src scripts
          uv run pip-audit
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Build image
        run: docker build --tag nexus-ai:scan .
      - name: Scan image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --exit-code 1 --severity HIGH,CRITICAL nexus-ai:scan
