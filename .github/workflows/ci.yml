name: NXS CI
on:
  pull_request:
  push:
    branches: [main, feat/nxs-p00-engineering-control-system]
permissions:
  contents: read
concurrency:
  group: nxs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.13", cache: pip}
      - name: Install locked package manager
        run: python -m pip install --disable-pip-version-check uv==0.11.32
      - name: Install dependencies from lock
        run: uv sync --frozen --all-groups
      - name: Validate lock and control state
        run: |
          uv lock --check
          uv run python -m scripts.nxs_validate
      - name: Format, lint, and type check
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
      - name: Test
        run: uv run pytest
      - name: Guard
        run: |
          if [ "$(jq -r '.current_phase.status' .nxs/project-state.json)" = READY ]; then
            guard_output="$(uv run python -m scripts.nxs_guard --phase NXS-P00 --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" --json || true)"
            test "$(jq -r .code <<<"$guard_output")" = ALREADY_READY
          else
            uv run python -m scripts.nxs_guard --phase NXS-P00 --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" --json
          fi
      - name: Build production image
        run: docker build --pull --tag nexus-ai:${{ github.sha }} .
      - name: Verify non-root runtime and health
        run: |
          test "$(docker image inspect nexus-ai:${{ github.sha }} --format '{{.Config.User}}')" = "65532:65532"
          docker run --detach --name nexus-ci --publish 127.0.0.1:18080:8080 nexus-ai:${{ github.sha }}
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:18080/health && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:18080/version
          docker stop --time 10 nexus-ci
          docker rm nexus-ci
