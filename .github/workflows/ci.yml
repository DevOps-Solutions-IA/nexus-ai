name: NXS CI
on:
  pull_request:
  push:
    branches: [main, "feat/nxs-**", "fix/nxs-**", "release/**"]
permissions:
  contents: read
concurrency:
  group: nxs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.14"

jobs:
  state:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.14", cache: pip}
      - run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - run: uv sync --frozen --all-groups
      - name: Lock and repository state
        run: |
          uv lock --check
          uv run python -m scripts.nxs_validate
      - name: Phase-neutral execution guard
        run: |
          phase="$(uv run python -m scripts.nxs_guard current-phase || true)"
          if [ -z "$phase" ]; then
            echo "branch is not a phase branch; repository state validated only"
            exit 0
          fi
          echo "detected phase: $phase"
          status="$(jq -r --arg p "$phase" '.phases[] | select(.id==$p) | .status' .nxs/phase-registry.json)"
          if [ "$status" = READY ]; then
            out="$(uv run python -m scripts.nxs_guard --phase "$phase" --json || true)"
            test "$(jq -r .code <<<"$out")" = ALREADY_READY
          else
            uv run python -m scripts.nxs_guard --phase "$phase" --json
          fi

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.14", cache: pip}
      - run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - run: uv sync --frozen --all-groups
      - name: Format, lint, and type check
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
      - name: Unit, contract, security, concurrency, and resilience tests
        run: uv run pytest -m "not integration" --cov-fail-under=0
      - name: Control-system security scan
        run: |
          uv run bandit -q -lll -c pyproject.toml -r src scripts
          uv run pip-audit

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.14", cache: pip}
      - run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
      - run: uv sync --frozen --all-groups
      - name: Start real PostgreSQL, Valkey, and NATS/JetStream
        run: docker compose up -d --wait
      - name: Bootstrap non-bypass database roles
        run: uv run python -m scripts.nxs_dbadmin bootstrap
      - name: Migrations (migration role) and tenant schema guard
        env:
          NXS_ENVIRONMENT: test
          NXS_DATABASE__DSN: postgresql+asyncpg://nexus_runtime:local-runtime-only@127.0.0.1:15432/nexus_local
          NXS_DATABASE__MIGRATION_DSN: postgresql+asyncpg://nexus_migration:local-migration-only@127.0.0.1:15432/nexus_local
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run python -m scripts.nxs_schema_guard
      - name: Full suite with coverage gate (runtime role, RLS enforced)
        env:
          NXS_ENVIRONMENT: test
          NXS_DATABASE__DSN: postgresql+asyncpg://nexus_runtime:local-runtime-only@127.0.0.1:15432/nexus_local
          NXS_DATABASE__MIGRATION_DSN: postgresql+asyncpg://nexus_migration:local-migration-only@127.0.0.1:15432/nexus_local
        run: uv run pytest
      - if: always()
        run: docker compose logs --no-color | tail -n 200
      - if: always()
        run: docker compose down --volumes

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Build production image
        run: docker build --pull --tag "nexus-ai:${GITHUB_SHA}" .
      - name: Verify non-root runtime
        run: |
          user="$(docker image inspect "nexus-ai:${GITHUB_SHA}" --format '{{.Config.User}}')"
          test "$user" = "65532:65532"
      - name: Liveness stays up and readiness reports 503 when dependencies are unavailable
        run: |
          docker run --detach --name nxs-nodeps --publish 127.0.0.1:18080:8080 \
            --env NXS_ENVIRONMENT=local \
            --env 'NXS_DATABASE__DSN=postgresql+asyncpg://x:y@127.0.0.1:5999/none' \
            --env 'NXS_CACHE__URL=redis://127.0.0.1:6399/0' \
            --env 'NXS_MESSAGING__URL=nats://127.0.0.1:4299' \
            --env NXS_MESSAGING__CONNECT_TIMEOUT_SECONDS=1 \
            "nexus-ai:${GITHUB_SHA}"
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18080/health/live && break || sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health/live
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/health/ready)"
          test "$code" = "503"
          curl --fail --silent http://127.0.0.1:18080/version
          docker logs nxs-nodeps | tail -n 30
          docker rm --force nxs-nodeps
      - name: Readiness reports 200 with dependencies, using the non-bypass runtime role
        run: |
          # A fresh compose volume runs infrastructure/postgres/roles.sql via initdb,
          # so nexus_migration / nexus_runtime already exist. Migrate with the image's
          # own bundled Alembic (migration role) — no host toolchain needed.
          docker compose up -d --wait
          docker run --rm --network host --entrypoint /opt/venv/bin/alembic \
            --env NXS_ENVIRONMENT=local \
            --env 'NXS_DATABASE__MIGRATION_DSN=postgresql+asyncpg://nexus_migration:local-migration-only@127.0.0.1:15432/nexus_local' \
            "nexus-ai:${GITHUB_SHA}" upgrade head
          docker run --detach --name nxs-deps --network host \
            --env NXS_ENVIRONMENT=local \
            --env 'NXS_DATABASE__DSN=postgresql+asyncpg://nexus_runtime:local-runtime-only@127.0.0.1:15432/nexus_local' \
            --env 'NXS_CACHE__URL=redis://127.0.0.1:16379/0' \
            --env 'NXS_MESSAGING__URL=nats://127.0.0.1:14222' \
            "nexus-ai:${GITHUB_SHA}"
          ready=1
          for attempt in {1..30}; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/health/ready || true)"
            if [ "$code" = "200" ]; then ready=0; break; fi
            sleep 1
          done
          docker logs nxs-deps | tail -n 50
          test "$ready" -eq 0
      - if: always()
        run: |
          docker rm --force nxs-deps nxs-nodeps 2>/dev/null || true
          docker compose down --volumes 2>/dev/null || true

  multiarch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0
        with: {platforms: arm64}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Build linux/amd64 and linux/arm64 (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load and health-smoke the linux/arm64 image under emulation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: nexus-ai:arm64-smoke
          cache-from: type=gha
      - name: ARM64 non-root + liveness/readiness smoke
        run: |
          test "$(docker image inspect nexus-ai:arm64-smoke --format '{{.Architecture}}')" = "arm64"
          test "$(docker image inspect nexus-ai:arm64-smoke --format '{{.Config.User}}')" = "65532:65532"
          docker run --detach --name nxs-arm --platform linux/arm64 --publish 127.0.0.1:18090:8080 \
            --env NXS_ENVIRONMENT=local \
            --env 'NXS_DATABASE__DSN=postgresql+asyncpg://x:y@127.0.0.1:5999/none' \
            --env 'NXS_CACHE__URL=redis://127.0.0.1:6399/0' \
            --env 'NXS_MESSAGING__URL=nats://127.0.0.1:4299' \
            --env NXS_MESSAGING__CONNECT_TIMEOUT_SECONDS=1 \
            nexus-ai:arm64-smoke
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:18090/health/live && break || sleep 1
          done
          curl --fail --silent http://127.0.0.1:18090/health/live
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18090/health/ready)"
          test "$code" = "503"
          curl --fail --silent http://127.0.0.1:18090/api/v1/system/version
          docker rm --force nxs-arm
