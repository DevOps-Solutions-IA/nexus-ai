[server:default]
method = TLSv1.2+
verify_certificate = yes
require_certificate = yes
private_key = /run/secrets/sip/identity.key
certificate = /run/secrets/sip/identity.pem
ca_list = /run/secrets/sip/ca.pem
verify_depth = 3

[client:default]
method = TLSv1.2+
verify_certificate = yes
require_certificate = yes
private_key = /run/secrets/sip/identity.key
certificate = /run/secrets/sip/identity.pem
ca_list = /run/secrets/sip/ca.pem
verify_depth = 3
