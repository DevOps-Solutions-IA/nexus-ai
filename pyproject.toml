[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nexus-ai"
version = "0.1.0"
description = "Nexus AI engineering control system and backend foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "jsonschema[format]==4.25.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "bandit==1.8.6",
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "ruff==0.16.6",
  "types-jsonschema==4.25.1.20250822",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_ai", "scripts"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/nxs_control/core.py" = ["S603", "S607"]
"scripts/nxs_gate/__main__.py" = ["S603"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["nexus_ai", "scripts"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=nexus_ai --cov=scripts.nxs_control --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.bandit]
exclude_dirs = ["tests"]
severity = "medium"
confidence = "medium"
